<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The BVE-9100's REC key, seen from above and in front: the top face, its skirt on four sides (the front
       tallest, as the eye is in front), and REC on the top -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ff8a5c"/>
      <stop offset="0.45" stop-color="#f2533a"/>
      <stop offset="1" stop-color="#d42f3f"/>
    </linearGradient>
    <radialGradient id="dish" cx="0.4" cy="0.2" r="0.85">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3262f"/>
      <stop offset="1" stop-color="#7a1424"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b52f22"/>
      <stop offset="1" stop-color="#d5442c"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#9c1f2c"/>
      <stop offset="1" stop-color="#c0303a"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8613f"/>
      <stop offset="1" stop-color="#d9433a"/>
    </linearGradient>
    <clipPath id="cap"><rect x="10" y="8" width="108" height="110" rx="12"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="emboss" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="0.8" flood-color="#6e0f1c" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <g clip-path="url(#cap)">
      <polygon points="10,8 118,8 108,13 20,13" fill="url(#back)"/>
      <polygon points="10,8 20,13 20,82 10,118" fill="url(#left)"/>
      <polygon points="118,8 108,13 108,82 118,118" fill="url(#right)"/>
      <polygon points="20,82 108,82 118,118 10,118" fill="url(#front)"/>
    </g>
    <!-- edge highlight where the top face meets the skirt -->
    <rect x="19" y="12" width="90" height="71" rx="7" fill="none" stroke="#ffb199" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="20" y="13" width="88" height="69" rx="6" fill="url(#top)"/>
    <rect x="20" y="13" width="88" height="69" rx="6" fill="url(#dish)"/>
  </g>

  <text x="64" y="58.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700"
        letter-spacing="1" fill="#fff" filter="url(#emboss)">REC</text>
</svg>
