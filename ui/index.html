<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BVE-9100</title>
<style>
  :root { --bg:#1b1d20; --panel:#4a4c50; --key:#d9d7cf; --keytext:#1a1a1a; --blue:#8fb6e8; --red:#d9433b; --pink:#d78aa6; --yellow:#e6c33c; --purple:#9c93cf; --gray:#b9b7b0; --dark:#5b5d61; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:#ddd; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
         display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; }
  #top { flex:none; display:flex; align-items:center; gap:14px; padding:8px 14px; background:#111; font-size:13px; }
  #top b { color:#fff; letter-spacing:1px; }
  #top input { width:140px; background:#222; color:#eee; border:1px solid #555; padding:3px 6px; font-family:monospace; }
  #top button { background:#333; color:#eee; border:1px solid #666; padding:3px 10px; cursor:pointer; }
  #screenwrap { flex:1 1 auto; min-height:0; display:flex; justify-content:center; align-items:center; padding:10px; background:#000; }
  canvas#screen { display:block; border:6px solid #2a2a2a; border-radius:6px; }
  #kbd { flex:none; background:var(--panel); margin:10px auto; padding:14px 16px 18px; border-radius:10px; width:max-content; user-select:none;
         box-shadow: 0 10px 30px #000 inset, 0 2px 0 #666; }
  #kbd .brand { color:#eee; font-weight:700; letter-spacing:2px; font-size:14px; margin:0 0 6px 4px; display:flex; justify-content:space-between; width:1340px; }
  .blocks { display:flex; gap:18px; align-items:flex-start; }
  .block { display:flex; flex-direction:column; gap:5px; }
  .row { display:flex; gap:5px; height:46px; }
  .key { position:relative; width:52px; height:46px; border-radius:4px; background:var(--key); color:var(--keytext); cursor:pointer;
         box-shadow: 0 3px 0 #777, 0 4px 4px #0008; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;
         font-size:9px; line-height:1.05; padding:2px; box-sizing:border-box; }
  .key:active, .key.down { transform: translateY(2px); box-shadow: 0 1px 0 #777; }
  .key .t { font-size:8px; color:#333; white-space:pre-line; }
  .key .m { font-size:11px; font-weight:600; white-space:pre-line; }
  .key .s { font-size:6.5px; color:#444; position:absolute; bottom:1px; left:0; right:0; }
  .key.blue { background:var(--blue); } .key.red { background:var(--red); color:#fff; } .key.red .t,.key.red .s { color:#fdd; }
  .key.pink { background:var(--pink); } .key.yellow { background:var(--yellow); } .key.purple { background:var(--purple); }
  .key.gray { background:var(--gray); } .key.dark { background:var(--dark); color:#eee; } .key.dark .t { color:#ccc; }
  .key.w15 { width:80px; } .key.w2 { width:109px; } .key.w25 { width:137px; } .key.w9 { width:500px; } .key.tall { height:97px; }
  .key.gap { visibility:hidden; }
  .key.unv::after { content:"?"; position:absolute; top:1px; right:3px; font-size:8px; color:#a33; }
  .key.held { outline:2px solid #ffeb3b; }
  .key .led { position:absolute; top:3px; right:4px; width:7px; height:7px; border-radius:50%; background:#3a1a12; box-shadow:0 0 1px #000 inset; }
  .key.lit .led { background:#ff4a24; box-shadow:0 0 6px 1px #ff6a3c; }
  .dial { width:170px; height:170px; border-radius:50%; background: radial-gradient(circle at 40% 35%, #555, #0d0d0d 70%); margin:6px auto; box-shadow: 0 6px 12px #0009; position:relative; cursor:grab; touch-action:none; user-select:none; }
  .dial.drag { cursor:grabbing; }
  .dial .mark { position:absolute; left:50%; top:12px; width:10px; height:10px; margin-left:-5px; border-radius:50%; background:#aaa; box-shadow:0 0 3px #000 inset; }
  .dial .cap { position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; background: radial-gradient(circle at 40% 35%, #444, #151515 75%); }
  .dialinfo { text-align:center; color:#888; font-size:11px; margin-top:-2px; }
  .ledbar { width:150px; height:34px; background:#111; border-radius:3px; margin:4px auto; color:#ccc; font-size:9px; text-align:center; padding-top:3px; }
  .ledbar i { display:inline-block; width:4px; height:4px; margin:1px; background:#143a14; }
  .ledbar i.on { background:#3f3; box-shadow:0 0 3px #3f3; }
  .ledbar .dirs { font-size:7px; display:flex; justify-content:space-between; align-items:center; padding:0 6px; margin-top:1px; }
  .ledbar .dir { display:inline-block; width:8px; height:4px; border-radius:1px; background:#3a1a12; vertical-align:middle; margin:0 3px; }
  .ledbar .dir.on { background:#ff4a24; box-shadow:0 0 5px 1px #ff6a3c; }
</style>

  // overlay plane (pop-up windows, swatches, selection bars): [row, col, char, bank, colours];
  // colours bits 0-3 foreground, 4-7 background (overlay palette, 0 = transparent)
  for(const [r,c,ch,font,a] of (scr.ov||[])){
    const x=c*CW, y=r*CH, bgi=(a>>4)&15; const fg=ovpal[a&15]||'#fff';
    let bg=bgi ? ovpal[bgi] : null;
    if(bg){ ctx.fillStyle=bg; ctx.fillRect(x,y,CW,CH); }
    if(ch!==0x20 || font) glyph(ch,font,x,y,fg,bg||'#000');
  }
}
async function tick(){
  try{ const scr=await fetch('/screen').then(r=>r.json()); lastScr=scr; render(scr); updateLamps(scr.lamps); }catch(e){}
}
layout();
setInterval(tick,100); setInterval(()=>{blinkPhase^=1;},500); tick();
</script>
